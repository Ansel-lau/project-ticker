name: Project Ticker Daily

on:
  schedule:
    # 22:17 UTC, Monday to Friday = 6:17 am Singapore, Tuesday to Saturday.
    - cron: "17 22 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Session date YYYY-MM-DD (leave blank for the latest)"
        required: false
        default: ""
      backfill:
        description: "Also build this many earlier sessions (e.g. 20)"
        required: false
        default: "0"
      video:
        description: "Also make the heatmap video (yes/no)"
        required: false
        default: "yes"

permissions:
  contents: write

concurrency: daily-data

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install libraries
        run: pip install -r requirements.txt
      - name: Build the data files
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          DATE_INPUT: ${{ inputs.date }}
          BACKFILL_INPUT: ${{ inputs.backfill }}
        run: |
          ARGS=""
          if [ -n "$DATE_INPUT" ]; then ARGS="$ARGS --date $DATE_INPUT"; fi
          if [ -n "$BACKFILL_INPUT" ] && [ "$BACKFILL_INPUT" != "0" ]; then ARGS="$ARGS --backfill $BACKFILL_INPUT"; fi
          python daily_data.py $ARGS

      # The video can never block the data: if this step fails, the job carries on.
      - name: Make the heatmap video
        id: video
        if: inputs.video != 'no'
        continue-on-error: true
        env:
          DATE_INPUT: ${{ inputs.date }}
        run: |
          # Always the same session as the data that was just built, never a
          # day the video script works out on its own.
          DATE="${DATE_INPUT:-$(python -c "import json; print(json.load(open('data/latest.json'))['session_date'])")}"
          echo "Making the heatmap video for $DATE"
          # Yahoo sometimes fails for a few minutes: try three times, 2 minutes apart.
          for i in 1 2 3; do
            python heatmap_video.py --date "$DATE" && exit 0
            echo "Video attempt $i failed"
            [ "$i" -lt 3 ] && sleep 120
          done
          exit 1

      - name: Save the files to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Never replace a session's file with one that has MORE missing prices
          # (Yahoo can be flaky later in the day): keep the earlier, cleaner copy.
          python - <<'PY'
          import json, subprocess
          out = subprocess.run(["git", "diff", "--name-only", "HEAD", "--", "data"],
                               capture_output=True, text=True).stdout.split()
          for f in out:
              if not f.endswith(".json") or f.endswith("index.json"):
                  continue
              old = subprocess.run(["git", "show", f"HEAD:{f}"], capture_output=True, text=True)
              if old.returncode != 0:
                  continue                      # a new file: nothing to compare
              try:
                  old, new = json.loads(old.stdout), json.load(open(f))
              except Exception:
                  continue
              if (old.get("session_date") == new.get("session_date")
                      and len(new.get("errors", [])) > len(old.get("errors", []))):
                  subprocess.run(["git", "checkout", "HEAD", "--", f], check=True)
                  print(f"Kept the earlier {f}: it had {len(old.get('errors', []))} missing "
                        f"price(s), this run had {len(new.get('errors', []))}")
          PY
          git add data
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Market data $(date -u +%Y-%m-%d)"
          # If someone uploaded a file while this run was working, catch up
          # with it first; try up to 3 times.
          for i in 1 2 3; do
            git pull --rebase --quiet origin main && git push && exit 0
            echo "Push failed (attempt $i); retrying in 10 s"
            sleep 10
          done
          exit 1

      # Videos go to their own branch, "heatmap-videos", which is replaced (not
      # added to) every day: it only ever holds the last 30 sessions, so the
      # repository does not grow. Files on a branch have direct raw links,
      # which Notion can fetch (it cannot follow the redirect of a Release link).
      - name: Publish the video (keeps the last 30 sessions)
        if: steps.video.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          BR=heatmap-videos
          URL="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          F=$(cat video/latest.txt)
          STEM="${F%.mp4}"
          PUB="$RUNNER_TEMP/pub"
          rm -rf "$PUB"
          git clone --quiet --depth 1 --branch "$BR" "$URL" "$PUB" 2>/dev/null || mkdir -p "$PUB"
          cp "video/$STEM.mp4" "video/$STEM.png" "$PUB/"
          cd "$PUB"
          rm -rf .git
          ls heatmap-????-??-??.mp4 | sort -r | tail -n +31 | while read -r OLD; do
            rm -f "$OLD" "${OLD%.mp4}.png"
          done
          cp "$STEM.mp4" heatmap-latest.mp4
          cp "$STEM.png" heatmap-latest.png
          printf '# Daily S&P 500 heatmap videos\n\nMade by heatmap_video.py on the main branch. Last 30 sessions; this branch is rewritten daily.\n' > README.md
          git init --quiet -b "$BR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "Heatmap videos up to $STEM"
          git push --quiet --force "$URL" "$BR"
          echo "Video: https://raw.githubusercontent.com/${REPO}/${BR}/${STEM}.mp4"
